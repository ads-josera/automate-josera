ai_adminops.dashboard:
  path: '/admin/reports/ai-adminops'
  defaults:
    _controller: '\Drupal\ai_adminops\Controller\AdminOpsDashboardController::dashboard'
    _title: 'AI AdminOps'
  requirements:
    _permission: 'access ai adminops dashboard'

ai_adminops.settings:
  path: '/admin/config/system/ai-adminops'
  defaults:
    _form: '\Drupal\ai_adminops\Form\AdminOpsSettingsForm'
    _title: 'AI AdminOps settings'
  requirements:
    _permission: 'administer ai adminops'

