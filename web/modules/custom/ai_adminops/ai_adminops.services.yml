services:
  logger.channel.ai_adminops:
    parent: logger.channel_base
    arguments: ['ai_adminops']

  ai_adminops.ai_client:
    class: Drupal\ai_adminops\Service\AdminOpsAiClient
    arguments:
      - '@Drupal\ai_whatsapp_automation\Application\OpenAI\OpenAIServiceInterface'
      - '@logger.channel.ai_adminops'

  ai_adminops.notification_bridge:
    class: Drupal\ai_adminops\Service\NotificationBridge
    arguments:
      - '@ai_whatsapp_automation.provider_message_sender'
      - '@plugin.manager.mail'
      - '@config.factory'
      - '@entity_type.manager'
      - '@state'
      - '@datetime.time'
      - '@logger.channel.ai_adminops'

  ai_adminops.payload_sanitizer:
    class: Drupal\ai_adminops\Service\PayloadSanitizer

  ai_adminops.event_manager:
    class: Drupal\ai_adminops\Service\AdminOpsEventManager
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@ai_adminops.payload_sanitizer'
      - '@ai_adminops.notification_bridge'
      - '@logger.channel.ai_adminops'

  ai_adminops.action_request_manager:
    class: Drupal\ai_adminops\Service\AdminOpsActionRequestManager
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@ai_adminops.payload_sanitizer'
      - '@logger.channel.ai_adminops'

  ai_adminops.execution_audit:
    class: Drupal\ai_adminops\Service\AdminOpsExecutionAudit
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@ai_adminops.payload_sanitizer'
      - '@logger.channel.ai_adminops'

  ai_adminops.read_only_ssh_connector:
    class: Drupal\ai_adminops\Service\ReadOnlySshConnector

  ai_adminops.monitoring_alert_evaluator:
    class: Drupal\ai_adminops\Service\MonitoringAlertEvaluator
    arguments:
      - '@config.factory'
      - '@ai_adminops.event_manager'
      - '@ai_adminops.execution_audit'
      - '@state'

  plugin.manager.ai_adminops_tool:
    class: Drupal\ai_adminops\Plugin\AdminOpsTool\AdminOpsToolManager
    arguments:
      - '@container.namespaces'
      - '@module_handler'
      - '@cache.discovery'

  ai_adminops.tool_policy:
    class: Drupal\ai_adminops\Service\AdminOpsToolPolicy
    arguments:
      - '@plugin.manager.ai_adminops_tool'
      - '@current_user'

  ai_adminops.monitoring_scheduler:
    class: Drupal\ai_adminops\Service\MonitoringScheduler
    arguments:
      - '@config.factory'
      - '@state'
      - '@queue'
      - '@entity_type.manager'
      - '@datetime.time'
      - '@logger.channel.ai_adminops'

  ai_adminops.monitoring_job_processor:
    class: Drupal\ai_adminops\Service\MonitoringJobProcessor
    arguments:
      - '@entity_type.manager'
      - '@state'
      - '@datetime.time'
      - '@ai_adminops.read_only_ssh_connector'
      - '@ai_adminops.execution_audit'
      - '@ai_adminops.monitoring_alert_evaluator'
      - '@logger.channel.ai_adminops'

  # Sentinel's server tools. ai_whatsapp_automation's OwnerToolRunner decides
  # who may call them (owner bot, owner number, owner tools switched on).
  ai_adminops.sentinel_server_tools:
    class: Drupal\ai_adminops\Service\SentinelServerTools
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@state'
      - '@datetime.time'
      - '@date.formatter'
      - '@ai_adminops.read_only_ssh_connector'
      - '@ai_adminops.execution_audit'
      - '@ai_adminops.account_usage_report'
    tags:
      - { name: ai_whatsapp_automation.owner_tool_provider }

  ai_adminops.account_usage_report:
    class: Drupal\ai_adminops\Service\AccountUsageReport

  # Phase B: actions with a code emailed to José. Nothing is offered until
  # settings.php has an action SSH profile and an approval address.
  ai_adminops.action_ssh_connector:
    class: Drupal\ai_adminops\Service\ActionSshConnector

  ai_adminops.sentinel_action_approval:
    class: Drupal\ai_adminops\Service\SentinelActionApproval
    arguments:
      - '@entity_type.manager'
      - '@ai_adminops.action_request_manager'
      - '@ai_adminops.execution_audit'
      - '@ai_adminops.action_ssh_connector'
      - '@plugin.manager.mail'
      - '@state'
      - '@datetime.time'
      - '@logger.channel.ai_adminops'

  ai_adminops.sentinel_action_tools:
    class: Drupal\ai_adminops\Service\SentinelActionTools
    arguments:
      - '@entity_type.manager'
      - '@ai_adminops.sentinel_action_approval'
    tags:
      - { name: ai_whatsapp_automation.owner_tool_provider }
