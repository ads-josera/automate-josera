ai_adminops.settings:
  type: config_object
  label: 'AI AdminOps settings'
  mapping:
    monitoring:
      type: mapping
      label: 'Monitoring settings'
      mapping:
        enabled:
          type: boolean
          label: 'Enable monitoring'
        interval_minutes:
          type: integer
          label: 'Monitoring interval in minutes'
    notifications:
      type: mapping
      label: 'Notification settings'
      mapping:
        enabled:
          type: boolean
          label: 'Enable notifications'
ai_adminops.server.*:
  type: config_entity
  label: 'AdminOps server'
  mapping:
    id:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
    hostname:
      type: string
      label: 'Hostname'
    port:
      type: integer
      label: 'Port'
    operating_system:
      type: string
      label: 'Operating system'
    provider:
      type: string
      label: 'Provider'
    connection_type:
      type: string
      label: 'Connection type'
    credential_reference:
      type: string
      label: 'Credential reference'
    server_status:
      type: string
      label: 'Operational status'
    description:
      type: text
      label: 'Description'
    active:
      type: boolean
      label: 'Active'
    tags:
      type: sequence
      label: 'Tags'
      sequence:
        type: string
