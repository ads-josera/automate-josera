ai_adminops.settings:
  type: config_object
  label: 'AI AdminOps settings'
  mapping:
    monitoring:
      type: mapping
      label: 'Monitoring settings'
      mapping:
        enabled:
          type: boolean
          label: 'Enable monitoring'
        interval_minutes:
          type: integer
          label: 'Monitoring interval in minutes'
    alerts:
      type: mapping
      label: 'Monitoring alert rules'
      mapping:
        enabled:
          type: boolean
          label: 'Enable metric alerts'
        unreachable_enabled:
          type: boolean
          label: 'Enable unreachable server alerts'
        load_1m_warning:
          type: float
          label: 'Load average warning threshold'
        cpu_percent_warning:
          type: integer
          label: 'CPU warning threshold'
        memory_percent_warning:
          type: integer
          label: 'Memory warning threshold'
        disk_percent_warning:
          type: integer
          label: 'Disk warning threshold'
        exim_queue_warning:
          type: integer
          label: 'Exim queue warning threshold'
    notifications:
      type: mapping
      label: 'Notification settings'
      mapping:
        enabled:
          type: boolean
          label: 'Enable notifications'
        minimum_severity:
          type: string
          label: 'Minimum notification severity'
        cooldown_minutes:
          type: integer
          label: 'Notification cooldown in minutes'
        email:
          type: mapping
          label: 'Email notification settings'
          mapping:
            enabled:
              type: boolean
              label: 'Enable email notifications'
            recipients:
              type: sequence
              label: 'Email recipients'
              sequence:
                type: email
        whatsapp:
          type: mapping
          label: 'WhatsApp notification settings'
          mapping:
            enabled:
              type: boolean
              label: 'Enable WhatsApp notifications'
            account_id:
              type: string
              label: 'WhatsApp account ID'
            recipients:
              type: sequence
              label: 'WhatsApp recipients'
              sequence:
                type: string
            template_sid:
              type: string
              label: 'Twilio content template SID'
ai_adminops.server.*:
  type: config_entity
  label: 'AdminOps server'
  mapping:
    id:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
    hostname:
      type: string
      label: 'Hostname'
    port:
      type: integer
      label: 'Port'
    operating_system:
      type: string
      label: 'Operating system'
    provider:
      type: string
      label: 'Provider'
    connection_type:
      type: string
      label: 'Connection type'
    credential_reference:
      type: string
      label: 'Credential reference'
    server_status:
      type: string
      label: 'Operational status'
    description:
      type: text
      label: 'Description'
    active:
      type: boolean
      label: 'Active'
    tags:
      type: sequence
      label: 'Tags'
      sequence:
        type: string
