ai_whatsapp_automation.settings:
  path: '/admin/config/services/ai-whatsapp-automation'
  defaults:
    _form: '\Drupal\ai_whatsapp_automation\Form\SettingsForm'
    _title: 'AI WhatsApp Automation'
  requirements:
    _permission: 'administer ai whatsapp automation'

ai_whatsapp_automation.webhook:
  path: '/ai-whatsapp-automation/webhook/{provider}'
  defaults:
    _controller: '\Drupal\ai_whatsapp_automation\Controller\WebhookController::handle'
  requirements:
    _access: 'TRUE'
    provider: 'twilio|cloud_api|evolution'
  methods: [GET, POST]

ai_whatsapp_automation.web_chat_page:
  path: '/ai-whatsapp-automation/chat/{token}'
  defaults:
    _controller: '\Drupal\ai_whatsapp_automation\Controller\WebChatController::page'
    _title: 'Chat'
  requirements:
    _access: 'TRUE'
    token: '[A-Za-z0-9_-]+'
  methods: [GET]

ai_whatsapp_automation.web_chat_embed:
  path: '/ai-whatsapp-automation/embed/{token}.js'
  defaults:
    _controller: '\Drupal\ai_whatsapp_automation\Controller\WebChatController::embed'
  requirements:
    _access: 'TRUE'
    token: '[A-Za-z0-9_-]+'
  methods: [GET]

ai_whatsapp_automation.web_chat_api:
  path: '/ai-whatsapp-automation/api/web-chat/{token}'
  defaults:
    _controller: '\Drupal\ai_whatsapp_automation\Controller\WebChatController::message'
  requirements:
    _access: 'TRUE'
    token: '[A-Za-z0-9_-]+'
  methods: [POST, OPTIONS]

ai_whatsapp_automation.dashboard:
  path: '/admin/reports/ai-whatsapp-automation'
  defaults:
    _controller: '\Drupal\ai_whatsapp_automation\Controller\DashboardController::dashboard'
    _title: 'AI WhatsApp Dashboard'
  requirements:
    _permission: 'view ai whatsapp automation dashboard'

ai_whatsapp_automation.rag_upload:
  path: '/admin/content/ai-whatsapp/knowledge/upload'
  defaults:
    _form: '\Drupal\ai_whatsapp_automation\Form\RAG\KnowledgeDocumentUploadForm'
    _title: 'Upload knowledge document'
  requirements:
    _permission: 'administer ai whatsapp automation rag'

ai_whatsapp_automation.evolution_connections:
  path: '/admin/content/ai-whatsapp/evolution'
  defaults:
    _controller: '\Drupal\ai_whatsapp_automation\Controller\Evolution\EvolutionConnectionController::overview'
    _title: 'Evolution QR connections'
  requirements:
    _permission: 'administer ai whatsapp automation evolution'

ai_whatsapp_automation.evolution_account_qr:
  path: '/admin/content/ai-whatsapp/accounts/{ai_whatsapp_account}/evolution-qr'
  defaults:
    _form: '\Drupal\ai_whatsapp_automation\Form\Evolution\EvolutionQrForm'
    _title: 'Evolution QR connection'
  requirements:
    _permission: 'administer ai whatsapp automation evolution'
  options:
    parameters:
      ai_whatsapp_account:
        type: entity:ai_whatsapp_account

ai_whatsapp_automation.multibot_routing:
  path: '/admin/content/ai-whatsapp/routing'
  defaults:
    _controller: '\Drupal\ai_whatsapp_automation\Controller\MultiBotRoutingController::overview'
    _title: 'MultiBot routing'
  requirements:
    _permission: 'administer ai whatsapp automation entities'

ai_whatsapp_automation.bot_web_integration:
